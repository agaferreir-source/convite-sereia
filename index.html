<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Um convite especial 💜</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main id="convite">

        <!-- PRIMEIRA TELA -->
        <section id="abertura" class="tela ativa">

            <img
                src="imagens/file_00000000a768820e94da58a218e48e11.png"
                alt="Convite especial"
                class="imagem-abertura"
            >

            <!-- Área invisível sobre o lacre -->
            <button
                id="abrirConvite"
                class="area-lacre"
                aria-label="Toque no lacre para abrir o convite"
            ></button>

        </section>


        <!-- SEGUNDA TELA - VAMOS CRIAR DEPOIS -->
        <section id="mensagem" class="tela segunda-tela">

            <div class="conteudo-mensagem">
                <h1>Olá! 💜</h1>
                <p>Uma mensagem muito especial está chegando...</p>
            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
