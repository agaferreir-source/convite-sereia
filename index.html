<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Um convite especial</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main id="convite">

        <!-- =================================================
             ABERTURA
        ================================================== -->

        <section id="abertura">

            <img
                src="imagens/file_00000000a768820e94da58a218e48e11.png"
                alt="Convite"
                class="imagem-abertura"
            >

            <!-- Área invisível sobre o lacre -->

            <button
                id="abrirConvite"
                class="area-lacre"
                aria-label="Toque no lacre para abrir"
            ></button>

        </section>


        <!-- =================================================
             CENA DO FUNDO DO MAR
        ================================================== -->

        <section
            id="cenaMar"
            class="cena-mar"
        >

            <!-- Imagem principal -->

            <img
                src="imagens/file_000000005348820e88dc88e2d0c1234c.png"
                alt="Fundo do mar"
                class="imagem-mar"
            >


            <!-- =================================================
                 EFEITO DE LUZ
            ================================================== -->

            <div class="luz-agua"></div>


            <!-- =================================================
                 PEIXINHOS
            ================================================== -->

            <div class="peixe peixe-1">
                <span class="corpo-peixe"></span>
                <span class="cauda-peixe"></span>
                <span class="olho-peixe"></span>
            </div>

            <div class="peixe peixe-2">
                <span class="corpo-peixe"></span>
                <span class="cauda-peixe"></span>
                <span class="olho-peixe"></span>
            </div>

            <div class="peixe peixe-3">
                <span class="corpo-peixe"></span>
                <span class="cauda-peixe"></span>
                <span class="olho-peixe"></span>
            </div>


            <!-- =================================================
                 BOLHAS
            ================================================== -->

            <div class="bolha bolha-1"></div>
            <div class="bolha bolha-2"></div>
            <div class="bolha bolha-3"></div>
            <div class="bolha bolha-4"></div>
            <div class="bolha bolha-5"></div>
            <div class="bolha bolha-6"></div>
            <div class="bolha bolha-7"></div>
            <div class="bolha bolha-8"></div>
            <div class="bolha bolha-9"></div>
            <div class="bolha bolha-10"></div>


            <!-- =================================================
                 BRILHOS DA ÁGUA
            ================================================== -->

            <div class="brilho brilho-1"></div>
            <div class="brilho brilho-2"></div>
            <div class="brilho brilho-3"></div>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
