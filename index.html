<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#75d9f5">
  <title>Convite da Antonella</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="convite">

    <!-- PRIMEIRA TELA -->
    <section class="tela ativa" id="tela1">
      <img src="Primeiro.png" alt="Abertura do convite">

      <!-- Área invisível para abrir -->
      <button
        class="area-toque"
        id="abrirConvite"
        aria-label="Abrir convite">
      </button>
    </section>


    <!-- SEGUNDA TELA -->
    <section class="tela" id="tela2">
      <img src="Segundo.png" alt="Mensagem do convite">

      <div class="efeitos">
        <span class="bolha b1"></span>
        <span class="bolha b2"></span>
        <span class="bolha b3"></span>
        <span class="bolha b4"></span>
        <span class="brilho brilho1"></span>
        <span class="brilho brilho2"></span>
        <span class="brilho brilho3"></span>
      </div>

      <button
        class="area-toque"
        id="irTela3"
        aria-label="Continuar">
      </button>
    </section>


    <!-- TERCEIRA TELA -->
    <section class="tela" id="tela3">
      <img src="Terceiro.png" alt="Antonella, data e horário">

      <div class="efeitos">
        <span class="bolha b5"></span>
        <span class="bolha b6"></span>
        <span class="bolha b7"></span>
        <span class="brilho brilho4"></span>
        <span class="brilho brilho5"></span>
      </div>

      <button
        class="area-toque"
        id="irTela4"
        aria-label="Continuar">
      </button>
    </section>


    <!-- QUARTA TELA -->
    <section class="tela" id="tela4">
      <img src="Quarto.png" alt="Informações do aniversário">

      <!--
        ÁREAS CLICÁVEIS
        Vamos posicionar depois exatamente em cima
        dos três elementos da sua arte.
      -->

      <button
        class="botao-invisivel local"
        id="botaoLocal"
        aria-label="Abrir localização">
      </button>

      <button
        class="botao-invisivel presentes"
        id="botaoPresentes"
        aria-label="Ver sugestão de presentes">
      </button>

      <button
        class="botao-invisivel rsvp"
        id="botaoRsvp"
        aria-label="Confirmar presença">
      </button>

    </section>

  </main>

  <script src="script.js"></script>

</body>
</html>
