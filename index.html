<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Convite Antonella - 3 Anos</title>

    <link rel="stylesheet" href="style.css">
</head>


<body>

    <main id="convite">


        <!-- ==================================================
             PRIMEIRA TELA
        =================================================== -->

        <section
            class="tela ativa"
            id="tela1"
        >

            <img
                src="Primeiro.png"
                alt="Abertura do convite"
                class="imagem-tela"
            >

            <!-- Área para tocar no lacre -->

            <button
                id="abrirConvite"
                class="area-lacre"
                aria-label="Abrir convite"
            ></button>

        </section>



        <!-- ==================================================
             SEGUNDA TELA
        =================================================== -->

        <section
            class="tela"
            id="tela2"
        >

            <img
                src="Segundo.png"
                alt="Mensagem do convite"
                class="imagem-tela"
            >

        </section>



        <!-- ==================================================
             TERCEIRA TELA
        =================================================== -->

        <section
            class="tela"
            id="tela3"
        >

            <img
                src="Terceiro.png"
                alt="Data e horário do aniversário"
                class="imagem-tela"
            >

        </section>



        <!-- ==================================================
             QUARTA TELA
        =================================================== -->

        <section
            class="tela"
            id="tela4"
        >

            <img
                src="Quarto.png"
                alt="Informações do aniversário"
                class="imagem-tela"
            >


            <!-- ==============================================
                 SUGESTÃO DE PRESENTES
            =============================================== -->

            <button
                id="botaoPresentes"
                class="botao-interativo botao-presentes"
                aria-label="Sugestão de presentes"
            ></button>



            <!-- ==============================================
                 LOCALIZAÇÃO
            =============================================== -->

            <button
                id="botaoLocal"
                class="botao-interativo botao-local"
                aria-label="Abrir localização"
            ></button>



            <!-- ==============================================
                 CONFIRMAR PRESENÇA
            =============================================== -->

            <button
                id="botaoConfirmar"
                class="botao-interativo botao-confirmar"
                aria-label="Confirmar presença"
            ></button>

        </section>



        <!-- ==================================================
             QUINTA TELA — SUGESTÃO DE PRESENTES
        =================================================== -->

        <section
            class="tela"
            id="tela5"
        >

            <img
                src="Quinta.jpg"
                alt="Sugestão de presentes"
                class="imagem-tela"
            >


            <!-- Botão para voltar -->

            <button
                id="voltarPresentes"
                class="botao-voltar"
                aria-label="Voltar"
            >
                ×
            </button>

        </section>


    </main>



    <!-- ======================================================
         CAMADA DA TRANSIÇÃO
    ======================================================= -->

    <div
        id="transicao"
        aria-hidden="true"
    >

        <div class="luz-agua"></div>

        <div class="bolha bolha1"></div>
        <div class="bolha bolha2"></div>
        <div class="bolha bolha3"></div>
        <div class="bolha bolha4"></div>
        <div class="bolha bolha5"></div>
        <div class="bolha bolha6"></div>

        <div class="brilho brilho1"></div>
        <div class="brilho brilho2"></div>
        <div class="brilho brilho3"></div>

    </div>



    <!-- ======================================================
         AVISO DE CONFIRMAÇÃO
    ======================================================= -->

    <div
        id="avisoConfirmacao"
        class="aviso"
    >

        <div class="aviso-caixa">

            <div class="aviso-coracao">
                💗
            </div>

            <p>
                A confirmação de presença será configurada em breve.
            </p>

            <button
                id="fecharAviso"
            >
                OK
            </button>

        </div>

    </div>



    <script src="script.js"></script>

</body>

</html>
