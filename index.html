<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Convite da Antonella</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main id="convite">

        <!-- TELA 1 -->
        <section class="tela ativa" id="tela1">
            <img src="Primeiro.jpg" alt="Convite - abertura">
            
            <div class="area-toque" id="abrirConvite"></div>
        </section>


        <!-- TELA 2 -->
        <section class="tela" id="tela2">
            <img src="Segundo.jpg" alt="Convite - mensagem">
        </section>


        <!-- TELA 3 -->
        <section class="tela" id="tela3">
            <img src="Terceiro.jpg" alt="Convite - informações">
        </section>


        <!-- TELA 4 -->
        <section class="tela" id="tela4">

            <img src="Quarto.jpg" alt="Convite - interações">

            <!-- ÁREA SUGESTÃO DE PRESENTES -->
            <button 
                class="area-interativa presente"
                id="botaoPresentes"
                aria-label="Sugestão de presentes">
            </button>

            <!-- ÁREA LOCALIZAÇÃO -->
            <button 
                class="area-interativa local"
                id="botaoLocal"
                aria-label="Localização">
            </button>

            <!-- ÁREA CONFIRMAÇÃO -->
            <button 
                class="area-interativa confirmar"
                id="botaoConfirmar"
                aria-label="Confirmar presença">
            </button>

        </section>


        <!-- TELA 5 -->
        <section class="tela" id="tela5">

            <img src="Quinta.jpg" alt="Sugestão de presentes">

            <button 
                class="voltar"
                id="voltarPresentes"
                aria-label="Voltar">
                ←
            </button>

        </section>

    </main>


    <!-- EFEITO DE TRANSIÇÃO -->
    <div id="transicao">
        <div class="bolhas"></div>
    </div>


    <script src="script.js"></script>

</body>
</html>
