<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <meta name="theme-color" content="#78dff5">

  <title>Convite da Antonella</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="convite">

    <!-- =========================
         TELA 1 - LACRE
    ========================== -->

    <section class="tela tela-1 ativa" id="tela1">

      <img
        src="Primeiro.png"
        alt="Abertura do convite"
        class="imagem"
      >

      <div class="camada-efeitos"></div>

      <button
        class="area-toque"
        id="abrirConvite"
        aria-label="Abrir convite">
      </button>

    </section>


    <!-- =========================
         TELA 2 - MENSAGEM
    ========================== -->

    <section class="tela tela-2" id="tela2">

      <img
        src="Segundo.png"
        alt="Mensagem do convite"
        class="imagem"
      >

      <div class="camada-efeitos">

        <div class="bolhas"></div>

        <span class="brilho brilho-1"></span>
        <span class="brilho brilho-2"></span>
        <span class="brilho brilho-3"></span>
        <span class="brilho brilho-4"></span>

        <div class="luz-agua"></div>

      </div>

      <button
        class="area-toque"
        id="irTela3"
        aria-label="Continuar">
      </button>

    </section>


    <!-- =========================
         TELA 3 - DATA
    ========================== -->

    <section class="tela tela-3" id="tela3">

      <img
        src="Terceiro.png"
        alt="Antonella e informações da festa"
        class="imagem"
      >

      <div class="camada-efeitos">

        <div class="bolhas"></div>

        <span class="brilho brilho-5"></span>
        <span class="brilho brilho-6"></span>
        <span class="brilho brilho-7"></span>

        <div class="luz-agua"></div>

      </div>

      <button
        class="area-toque"
        id="irTela4"
        aria-label="Continuar">
      </button>

    </section>


    <!-- =========================
         TELA 4 - INTERAÇÕES
    ========================== -->

    <section class="tela tela-4" id="tela4">

      <img
        src="Quarto.png"
        alt="Informações do aniversário"
        class="imagem"
      >

      <div class="camada-efeitos">

        <div class="bolhas"></div>

        <span class="brilho brilho-8"></span>
        <span class="brilho brilho-9"></span>

        <div class="luz-agua"></div>

      </div>


      <!-- LOCALIZAÇÃO -->

      <button
        class="botao-invisivel local"
        id="botaoLocal"
        aria-label="Ver localização">
      </button>


      <!-- PRESENTES -->

      <button
        class="botao-invisivel presentes"
        id="botaoPresentes"
        aria-label="Ver sugestão de presentes">
      </button>


      <!-- CONFIRMAÇÃO
           Será configurada depois -->

      <button
        class="botao-invisivel rsvp"
        id="botaoRsvp"
        aria-label="Confirmar presença">
      </button>


      <!-- MODAL DE PRESENTES -->

      <div
        class="modal-presentes"
        id="modalPresentes"
      >

        <button
          class="fechar-modal"
          id="fecharPresentes"
          aria-label="Fechar">
          ×
        </button>

        <img
          src="Quinta.jpg"
          alt="Sugestão de presentes"
        >

      </div>

    </section>


    <!-- TRANSIÇÃO -->

    <div
      class="transicao-mergulho"
      id="transicao"
    >

      <div class="transicao-bolhas"></div>

      <div class="transicao-luz"></div>

    </div>

  </main>


  <script src="script.js"></script>

</body>
</html>
