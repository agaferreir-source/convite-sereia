<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#07547a"
    >

    <title>Um convite especial</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <!-- =====================================================
         CONVITE
    ====================================================== -->

    <main id="convite">


        <!-- =================================================
             PRIMEIRA TELA
        ================================================== -->

        <section
            id="abertura"
            class="tela-abertura"
        >

            <img
                src="imagens/file_00000000a768820e94da58a218e48e11.png"
                alt="Convite"
                class="imagem-abertura"
            >


            <!--
                Área invisível sobre o lacre.

                A pessoa toca aqui para abrir
                o convite.
            -->

            <button
                id="abrirConvite"
                class="area-lacre"
                type="button"
                aria-label="Abrir convite"
            ></button>

        </section>



        <!-- =================================================
             CENA DO FUNDO DO MAR
        ================================================== -->

        <section
            id="cenaMar"
            class="cena-mar"
            aria-hidden="true"
        >


            <!-- =================================================
                 IMAGEM PRINCIPAL DO FUNDO DO MAR
            ================================================== -->

            <img
                src="imagens/file_000000005348820e88dc88e2d0c1234c.png"
                alt=""
                class="imagem-mar"
            >



            <!-- =================================================
                 LUZ / REFLEXO DA ÁGUA
            ================================================== -->

            <div
                class="luz-agua"
                aria-hidden="true"
            ></div>



            <!-- =================================================
                 BOLHAS
            ================================================== -->

            <div
                class="bolha bolha-1"
                aria-hidden="true"
            ></div>

            <div
                class="bolha bolha-2"
                aria-hidden="true"
            ></div>

            <div
                class="bolha bolha-3"
                aria-hidden="true"
            ></div>

            <div
                class="bolha bolha-4"
                aria-hidden="true"
            ></div>

            <div
                class="bolha bolha-5"
                aria-hidden="true"
            ></div>

            <div
                class="bolha bolha-6"
                aria-hidden="true"
            ></div>

            <div
                class="bolha bolha-7"
                aria-hidden="true"
            ></div>

            <div
                class="bolha bolha-8"
                aria-hidden="true"
            ></div>


        </section>


    </main>



    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script src="script.js"></script>

</body>

</html>
