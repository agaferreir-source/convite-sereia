<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Antonella - 3 Anos</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main id="convite">

        <!-- =========================
             PRIMEIRA TELA
        ========================== -->
        <section class="tela ativa" id="tela1">

            <img
                src="Primeiro.jpg"
                class="imagem-tela"
                alt="Abertura do convite"
            >

            <!-- Área invisível para tocar no lacre -->
            <button
                class="area-lacre"
                id="abrirConvite"
                aria-label="Abrir convite">
            </button>

            <div class="efeito-bolhas"></div>

        </section>


        <!-- =========================
             SEGUNDA TELA
        ========================== -->
        <section class="tela" id="tela2">

            <img
                src="Segundo.jpg"
                class="imagem-tela"
                alt="Mensagem do convite"
            >

            <div class="efeito-bolhas"></div>

            <button
                class="area-tela"
                id="irTela3"
                aria-label="Continuar">
            </button>

        </section>


        <!-- =========================
             TERCEIRA TELA
        ========================== -->
        <section class="tela" id="tela3">

            <img
                src="Terceiro.jpg"
                class="imagem-tela"
                alt="Data do aniversário"
            >

            <div class="efeito-bolhas"></div>

            <button
                class="area-tela"
                id="irTela4"
                aria-label="Ver informações">
            </button>

        </section>


        <!-- =========================
             QUARTA TELA
        ========================== -->
        <section class="tela" id="tela4">

            <img
                src="Quarto.jpg"
                class="imagem-tela"
                alt="Informações do aniversário"
            >

            <div class="efeito-bolhas"></div>

            <!-- BOTÃO PRESENTES -->
            <button
                class="botao-interacao botao-presentes"
                id="btnPresentes"
                aria-label="Sugestão de presentes">
            </button>

            <!-- BOTÃO LOCALIZAÇÃO -->
            <button
                class="botao-interacao botao-local"
                id="btnLocal"
                aria-label="Localização">
            </button>

            <!-- BOTÃO CONFIRMAÇÃO -->
            <button
                class="botao-interacao botao-confirmar"
                id="btnConfirmar"
                aria-label="Confirmar presença">
            </button>

        </section>

    </main>


    <!-- =========================
         JANELA DE PRESENTES
    ========================== -->

    <div class="modal" id="modalPresentes">

        <div class="modal-fundo"></div>

        <div class="modal-conteudo">

            <button
                class="fechar"
                id="fecharPresentes"
                aria-label="Fechar">
                ×
            </button>

            <img
                src="Quinta.jpg"
                alt="Sugestão de presentes"
                class="imagem-presentes"
            >

        </div>

    </div>


    <!-- =========================
         MENSAGEM DE CONFIRMAÇÃO
    ========================== -->

    <div class="aviso" id="aviso">

        <div class="aviso-caixa">

            <span>💗</span>

            <p>
                A confirmação de presença será configurada em breve.
            </p>

            <button id="fecharAviso">
                OK
            </button>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
